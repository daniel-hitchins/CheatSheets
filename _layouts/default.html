<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" integrity="sha384-NZhm4G1I7BpEGdjDKnzEfy3d78xvy7ECKUwwnKTYi036z42IyF056PbHfpQLIYgL" crossorigin="anonymous">
    <style>
        body {
            padding: 2rem 1rem;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
        }

        nav {
            margin-bottom: 2rem;
        }

        nav a {
            text-decoration: none;
        }

        nav a::before {
            content: "← ";
        }

        /* Code block enhancements */
        pre {
            border-radius: 0.5rem;
        }

        code {
            font-size: 0.9em;
        }

        /* Table enhancements */
        table {
            width: 100%;
            margin: 2rem 0;
        }

        /* Blockquote styling */
        blockquote {
            border-left: 4px solid var(--pico-primary);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
        }

        /* Emoji and icon support */
        h2::before {
            margin-right: 0.5rem;
        }

        /* Better list spacing */
        ul, ol {
            margin: 1rem 0;
        }

        li {
            margin: 0.5rem 0;
        }

        /* Horizontal rule */
        hr {
            margin: 3rem 0;
        }

        /* Footer */
        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--pico-muted-border-color);
            text-align: center;
            font-size: 0.9rem;
            color: var(--pico-muted-color);
        }

        /* Better heading spacing */
        h1 {
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--pico-muted-border-color);
            padding-bottom: 0.5rem;
        }

        h2 {
            margin-top: 3rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--pico-muted-border-color);
            padding-bottom: 0.5rem;
        }

        h3 {
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        h4 {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        /* Print styles */
        @media print {
            nav, footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <nav>
            <a href="{{ site.baseurl }}/">Back to all cheat sheets</a>
        </nav>

        <article>
            {{ content }}
        </article>

        <footer>
            <p>Built with ❤️ for developers | <a href="https://github.com/daniel-hitchins/CheatSheets" target="_blank" rel="noopener">View on GitHub</a></p>
        </footer>
    </main>
</body>
</html>
